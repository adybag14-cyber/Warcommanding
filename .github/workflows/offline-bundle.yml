name: Build offline bundle

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - name: Checkout including Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build complete offline bundle
        shell: powershell
        run: ./scripts/Create-OfflineBundle.ps1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: WarCommander-offline-bundle
          path: release/WarCommander-offline-bundle.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/WarCommander-offline-bundle.zip --generate-notes --title "War Commander ${{ github.ref_name }}"
