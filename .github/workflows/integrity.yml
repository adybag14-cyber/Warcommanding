name: Verify recovered assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'seed-assets/**'
      - 'manifests/**'
      - 'tools/checksums.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout including Git LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify all binary checksums
        run: python tools/checksums.py verify
