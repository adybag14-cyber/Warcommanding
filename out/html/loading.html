<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
		<style>
			body {
				margin: 0;
				padding: 0;
				overflow: hidden;
				background-color: #000000;
			}

			main {
				min-height: 100vh;
				min-width: 100vw;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background-color: #000000;
				opacity: 1;
				transition: opacity 180ms ease-in;
			}

			main.splash-fade-out {
				opacity: 0;
			}

			.game-splash {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.startup-error {
				display: none;
				max-width: 560px;
				margin: 0 24px 24px;
				padding: 14px 16px;
				border: 1px solid #8e2d2d;
				border-radius: 4px;
				background: rgba(48, 10, 10, 0.72);
				color: #ffd4d4;
				text-align: center;
				line-height: 1.45;
				font-family: "Segoe UI", sans-serif;
				font-size: 14px;
			}

			.startup-error.is-visible {
				display: block;
			}

			.startup-error-title {
				margin: 0 0 8px;
				font-size: 16px;
				color: #ff8d8d;
				font-weight: 600;
			}

			.startup-error-message {
				margin: 0;
			}

			.kixeye-logo {
				height:32px;
				width:256px;
				margin-bottom: 16px;
				opacity: 0.6;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="game-splash">
				<img src="../assets/game_logo.png" alt="Game Logo"/>
			</div>
			<section id="startupError" class="startup-error" aria-live="assertive" role="alert">
				<h1 id="startupErrorTitle" class="startup-error-title">Unable to start</h1>
				<p id="startupErrorMessage" class="startup-error-message"></p>
			</section>
			<img class="kixeye-logo" src="../assets/kixeye_logo.png" alt="Kixeye Logo"/>
		</main>
		<script>
			(() => {
				const startupTransition = window.startupTransition;
				const params = new URLSearchParams(window.location.search);
				const configuredTitle = params.get("title") || "";

				const root = document.querySelector("main");
				const startupError = document.getElementById("startupError");
				const startupErrorTitle = document.getElementById("startupErrorTitle");
				const startupErrorMessage = document.getElementById("startupErrorMessage");
				let hasFaded = false;

				if (startupErrorTitle) {
					startupErrorTitle.textContent = `Unable to start ${configuredTitle}`;
				}

				const showErrorMessage = (message) => {
					if (!startupError || !startupErrorMessage || typeof message !== "string") {
						return;
					}

					const trimmedMessage = message.trim();
					if (!trimmedMessage) {
						return;
					}

					// Startup errors must be visible even if the splash was already faded for game load.
					if (root) {
						root.classList.remove("splash-fade-out");
						root.style.transitionDuration = "";
					}

					startupErrorMessage.textContent = trimmedMessage;
					startupError.classList.add("is-visible");
				};

				showErrorMessage(params.get("error"));

				let unsubscribeFadeOut;
				if (startupTransition && typeof startupTransition.onFadeOutRequested === "function") {
					unsubscribeFadeOut = startupTransition.onFadeOutRequested(({ requestId, durationMs }) => {
						if (!requestId) {
							return;
						}

						if (!root || hasFaded) {
							startupTransition.notifyFadeOutCompleted(requestId);
							return;
						}

						hasFaded = true;
						const fadeMs = Number.isFinite(Number(durationMs)) ? Math.max(0, Number(durationMs)) : 150;
						root.style.transitionDuration = `${fadeMs}ms`;
						root.classList.add("splash-fade-out");

						setTimeout(() => {
							startupTransition.notifyFadeOutCompleted(requestId);
						}, fadeMs);
					});
				}

				let unsubscribeStartupError;
				if (startupTransition && typeof startupTransition.onStartupError === "function") {
					unsubscribeStartupError = startupTransition.onStartupError(({ message }) => {
						showErrorMessage(message);
					});
				}

				window.addEventListener("beforeunload", () => {
					if (typeof unsubscribeFadeOut === "function") {
						unsubscribeFadeOut();
					}

					if (typeof unsubscribeStartupError === "function") {
						unsubscribeStartupError();
					}
				});
			})();
		</script>
	</body>
</html>
